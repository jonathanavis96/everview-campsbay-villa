- article [ref=f16e2]:
  - paragraph [ref=f16e5]: Welcome
  - heading "Everview" [level=1] [ref=f16e6]
  - paragraph [ref=f16e7]: 14 Cramond Road · Camps Bay · Cape Town
  - separator [ref=f16e8]
  - paragraph [ref=f16e9]: "Welcome to Everview. This brochure covers the practical things: how the house works, who to call, and the few rules we ask you to keep. Anything it does not answer, the property manager will."
  - generic [ref=f16e10]:
    - heading "Arrival and departure" [level=2] [ref=f16e11]
    - generic [ref=f16e12]:
      - generic [ref=f16e13]:
        - term [ref=f16e14]: Check-in
        - definition [ref=f16e15]: 2:00 PM – 7:00 PM
      - generic [ref=f16e16]:
        - term [ref=f16e17]: Check-out
        - definition [ref=f16e18]: By 10:00 AM
      - generic [ref=f16e19]:
        - term [ref=f16e20]: Arriving after 7:00 PM
        - definition [ref=f16e21]: Arrange in advance
      - generic [ref=f16e22]:
        - term [ref=f16e23]: Late check-out
        - definition [ref=f16e24]: Subject to availability, arranged in advance
    - paragraph [ref=f16e25]: The house is entered at street level, off a driveway with room for six cars. There is further parking in the cul-de-sac, which carries no through traffic.
  - generic [ref=f16e26]:
    - heading "WiFi" [level=2] [ref=f16e27]
    - paragraph [ref=f16e28]:
      - strong [ref=f16e29]: The WiFi network name and password are on the printed card in the house
      - text: — on the kitchen counter, beside this brochure. They are deliberately not printed in any document that leaves the property, for security reasons. If you cannot find the card, call the property manager and they will read it to you.
    - paragraph [ref=f16e30]: The connection is fibre, and it reaches every level of the house. It stays up through load-shedding on the house battery.
  - generic [ref=f16e31]:
    - heading "Alarm and security" [level=2] [ref=f16e32]
    - paragraph [ref=f16e33]:
      - strong [ref=f16e34]: The alarm codes and the arming steps are on the printed card in the house
      - text: ", with this brochure — not in this document, and not in any document that leaves the property, for the same reason as the WiFi password. The property manager will walk you through arming and disarming on arrival."
    - paragraph [ref=f16e35]: The property is monitored 24/7 by ADT Security, with armed response. If an alarm is triggered by accident, wait for the call from the monitoring centre and give them the passphrase from the card; do not simply re-arm and hope.
    - list [ref=f16e36]:
      - listitem [ref=f16e37]: Arm the alarm whenever the house is empty, and overnight.
      - listitem [ref=f16e38]: Close and lock the sliding doors on the terrace before arming.
      - listitem [ref=f16e39]: Keep the driveway gate closed.
  - generic [ref=f16e40]:
    - heading "Power" [level=2] [ref=f16e41]
    - paragraph [ref=f16e42]: A 40-panel solar array feeds a 26 kWh battery bank. The lights, the plugs, the entertainment system and the lift keep running through load-shedding on days the battery has had sun to charge. The air-conditioning and the oven draw on grid power when it is available, so those two may pause during a load-shedding slot.
  - generic [ref=f16e43]:
    - heading "Water" [level=2] [ref=f16e44]
    - paragraph [ref=f16e45]: "Water is drawn from a private borehole on the property and purified through three stages of filtration before it reaches a tap. It is drinkable straight from the tap, cold and soft, with nothing added to it. Cape Town is a dry city: short showers are appreciated."
  - generic [ref=f16e46]:
    - heading "The house day to day" [level=2] [ref=f16e47]
    - generic [ref=f16e48]:
      - generic [ref=f16e49]:
        - heading "Housekeeping" [level=3] [ref=f16e50]
        - paragraph [ref=f16e51]: Daily, with laundry provided and available on request.
        - heading "The lift" [level=3] [ref=f16e52]
        - paragraph [ref=f16e53]: Carries up to six people between the basement and the upper level, and runs through load-shedding.
      - generic [ref=f16e54]:
        - heading "The pool" [level=3] [ref=f16e55]
        - paragraph [ref=f16e56]: Heated year-round. Children in the garden should not be left unsupervised near it.
        - heading "Rubbish" [level=3] [ref=f16e57]
        - paragraph [ref=f16e58]: Bins are in the scullery; collection is weekly from the kerb in the cul-de-sac.
  - generic [ref=f16e59]:
    - heading "House rules" [level=2] [ref=f16e60]
    - list [ref=f16e61]:
      - listitem [ref=f16e62]: No pets.
      - listitem [ref=f16e63]: No smoking anywhere on the property.
      - listitem [ref=f16e64]: No parties or events — small gatherings by prior arrangement with the property manager.
      - listitem [ref=f16e65]: No unauthorised guests outside the booking group without prior arrangement.
      - listitem [ref=f16e66]: No commercial filming or photography.
      - listitem [ref=f16e67]: Damages reported to the property manager immediately.
