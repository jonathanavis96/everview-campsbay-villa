<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Everview - Luxury Villa Rental Camps Bay | Private 4-Bedroom Villa</title>
    <meta name="description" content="Experience luxury at Everview, an exclusive 4-bedroom villa in Camps Bay with panoramic ocean views, heated pool, and 100% solar power. Perfect for family getaways." />
    <meta name="author" content="Everview Villa" />
    <meta name="keywords" content="Camps Bay villa rental, luxury accommodation Cape Town, private villa South Africa, ocean view villa, solar powered villa" />
    <link rel="canonical" href="https://jonathanavis96.github.io/everview-campsbay-villa/" />

    <!-- Self-hosted, latin subset, the above-the-fold body/label face
         (design-direction §4). Fraunces is not preloaded: at 121 KB it is
         heavier than the hero photograph itself at mobile viewport widths,
         and preloading it competed directly with the hero <img> for
         throttled mobile bandwidth, regressing LCP well past the ≥90 gate.
         font-display: swap already renders the hero headline immediately in
         the fallback serif with no layout shift once Fraunces arrives. -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/archivo-variable-latin.woff2" crossorigin />

    <meta property="og:title" content="Everview - Luxury Villa Rental in Camps Bay" />
    <meta property="og:description" content="Exclusive 4-bedroom luxury villa with panoramic ocean views, heated pool, and premium amenities in prime Camps Bay location." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jonathanavis96.github.io/everview-campsbay-villa/" />
    <meta property="og:image" content="https://jonathanavis96.github.io/everview-campsbay-villa/social/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jonathanavis96.github.io/everview-campsbay-villa/social/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "name": "Everview",
        "description": "A four-bedroom luxury villa on Cramond Road in Camps Bay, Cape Town, with panoramic Atlantic and Table Mountain views, a heated pool, and 100% solar and battery backup power.",
        "url": "https://jonathanavis96.github.io/everview-campsbay-villa/",
        "image": "https://jonathanavis96.github.io/everview-campsbay-villa/social/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "14 Cramond Road",
          "addressLocality": "Camps Bay",
          "addressRegion": "Cape Town",
          "postalCode": "8040",
          "addressCountry": "ZA"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -33.952026,
          "longitude": 18.385788
        },
        "numberOfRooms": 4,
        "occupancy": {
          "@type": "QuantitativeValue",
          "maxValue": 8
        },
        "petsAllowed": false,
        "smokingAllowed": false,
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Heated pool" },
          { "@type": "LocationFeatureSpecification", "name": "Lift to all levels" },
          { "@type": "LocationFeatureSpecification", "name": "Solar power with battery storage" },
          { "@type": "LocationFeatureSpecification", "name": "Private borehole water supply" },
          { "@type": "LocationFeatureSpecification", "name": "Wine cellar and TV room" },
          { "@type": "LocationFeatureSpecification", "name": "Pool room with billiards table" },
          { "@type": "LocationFeatureSpecification", "name": "Study" },
          { "@type": "LocationFeatureSpecification", "name": "Off-street driveway parking for 6 cars" },
          { "@type": "LocationFeatureSpecification", "name": "24/7 monitoring with armed response" }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
